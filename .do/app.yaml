# Especificación de DigitalOcean App Platform (ADR-21). Los valores SECRET se capturan en el panel y se guardan cifrados.
# Supuesto técnico (ST-S3-03): verificar en el primer despliegue la exposición interna de "pagos" (internal_ports).
name: expressya
region: nyc
services:
  - name: core
    dockerfile_path: core/Dockerfile
    source_dir: core
    github: { repo: <organizacion>/expressya-prototipo, branch: main, deploy_on_push: true }
    http_port: 8000
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-1gb
    health_check: { http_path: /salud }
    routes: [ { path: / } ]
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${expressya-db.DATABASE_URL}" }   # base expressya
      - { key: PAGOS_URL, scope: RUN_TIME, value: "http://pagos:8001" }
      - { key: JWT_SECRETO, scope: RUN_TIME, type: SECRET }
      - { key: TOKEN_SERVICIO, scope: RUN_TIME, type: SECRET }
      - { key: AMBIENTE, scope: RUN_TIME, value: produccion }
  - name: pagos
    dockerfile_path: pagos/Dockerfile
    source_dir: pagos
    github: { repo: <organizacion>/expressya-prototipo, branch: main, deploy_on_push: true }
    internal_ports: [8001]            # sin ruta pública: solo lo llama core
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check: { http_path: /salud, port: 8001 }
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET }   # base expressya_pagos, usuario propio
      - { key: CORE_URL, scope: RUN_TIME, value: "http://core:8000" }
      - { key: JWT_SECRETO, scope: RUN_TIME, type: SECRET }
      - { key: TOKEN_SERVICIO, scope: RUN_TIME, type: SECRET }
workers:
  - name: core-worker
    dockerfile_path: core/Dockerfile
    source_dir: core
    github: { repo: <organizacion>/expressya-prototipo, branch: main, deploy_on_push: true }
    run_command: python -m app.worker
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${expressya-db.DATABASE_URL}" }
      - { key: PAGOS_URL, scope: RUN_TIME, value: "http://pagos:8001" }
      - { key: TOKEN_SERVICIO, scope: RUN_TIME, type: SECRET }
  - name: pagos-worker
    dockerfile_path: pagos/Dockerfile
    source_dir: pagos
    github: { repo: <organizacion>/expressya-prototipo, branch: main, deploy_on_push: true }
    run_command: python -m app.worker
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET }
      - { key: CORE_URL, scope: RUN_TIME, value: "http://core:8000" }
      - { key: TOKEN_SERVICIO, scope: RUN_TIME, type: SECRET }
      - { key: MINUTOS_ALERTA_FINANZAS, scope: RUN_TIME, value: "30" }
databases:
  - name: expressya-db
    engine: PG
    version: "16"
    production: true
    cluster_name: expressya-pg      # clúster administrado (ADR-16); bases expressya y expressya_pagos
